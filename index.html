<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शाळा - शिकूया आणि खेळूया!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #ffeaa7);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h1 {
            color: #d63031;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .sub-text {
            color: #636e72;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .menu-btn, .btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            transition: 0.2s;
        }
        .menu-btn:hover, .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .math-btn { background-color: #00b894; }
        .abc-btn { background-color: #e17055; }
        .missing-btn { background-color: #6c5ce7; }
        .back-btn { background-color: #b2bec3; font-size: 14px; padding: 10px; width: auto; margin-top: 15px; }

        .game-area { display: none; }

        .question-box {
            font-size: 28px;
            font-weight: bold;
            color: #2d3436;
            margin: 15px 0;
            background: #dfe6e9;
            padding: 15px;
            border-radius: 10px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .opt-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .score { font-size: 16px; font-weight: bold; color: #2d3436; margin-bottom: 10px; }
        #feedback { font-size: 16px; font-weight: bold; height: 25px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎒 लहान मुलांची शाळा 🚀</h1>
        <div class="sub-text">खेळता-खेळता शिका आणि गुण मिळवा!</div>

        <!-- मुख्य मेनू (Home Menu) -->
        <div id="main-menu">
            <button class="menu-btn math-btn" onclick="startMathQuiz()">🧮 गणिताची जादू (Math Quiz)</button>
            <button class="menu-btn abc-btn" onclick="startMarathiABC()">🇮🇳 मराठी अक्षर ओळख</button>
            <button class="menu-btn missing-btn" onclick="startMissingABC()">🔤 गाळलेली एबीसीडी (A-Z)</button>
        </div>

        <!-- गेम खेळण्याचा एरिया -->
        <div id="game-area" class="game-area">
            <div class="score">🏆 गुण: <span id="score">0</span></div>
            <div class="question-box" id="question">प्रश्न</div>

            <div class="options">
                <button class="opt-btn" onclick="checkAnswer(0)" id="opt0">0</button>
                <button class="opt-btn" onclick="checkAnswer(1)" id="opt1">0</button>
                <button class="opt-btn" onclick="checkAnswer(2)" id="opt2">0</button>
                <button class="opt-btn" onclick="checkAnswer(3)" id="opt3">0</button>
            </div>

            <div id="feedback"></div>
            <button class="menu-btn back-btn" onclick="goHome()">🏠 मुख्य मेनूवर जा</button>
        </div>
    </div>

    <script>
        let currentMode = "";
        let score = 0;
        let correctAnswer = "";
        let optionsList = [];

        // मराठी मुळाक्षरे लिस्ट
        const marathiLetters = ["अ", "आ", "इ", "ई", "उ", "ऊ", "ऋ", "ए", "ऐ", "ओ", "औ", "क", "ख", "ग", "घ", "च", "छ", "ज", "झ", "ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न", "प", "फ", "ब", "भ", "म", "य", "र", "ल", "व", "श", "ष", "स", "ह", "ळ", "क्ष", "ज्ञ"];
        // इंग्रजी वर्णमाला
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        function showGameScreen() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("game-area").style.display = "block";
            score = 0;
            document.getElementById("score").innerText = score;
        }

        function goHome() {
            document.getElementById("main-menu").style.display = "block";
            document.getElementById("game-area").style.display = "none";
        }

        // १. गणिताचा गेम सुरू करणे
        function startMathQuiz() {
            currentMode = "math";
            showGameScreen();
            loadMathQuestion();
        }

        function loadMathQuestion() {
            document.getElementById("feedback").innerText = "";
            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            let op = Math.random() > 0.5 ? '+' : '-';
            if (op === '-' && num1 < num2) { [num1, num2] = [num2, num1]; }

            correctAnswer = (op === '+') ? (num1 + num2) : (num1 - num2);
            document.getElementById("question").innerText = `${num1} ${op} ${num2} = ?`;

            let correctPos = Math.floor(Math.random() * 4);
            optionsList = [];
            for (let i = 0; i < 4; i++) {
                if (i === correctPos) {
                    optionsList.push(correctAnswer);
                } else {
                    let wrong = correctAnswer + (Math.floor(Math.random() * 6) - 3);
                    while (wrong === correctAnswer || wrong < 0 || optionsList.includes(wrong)) {
                        wrong = correctAnswer + (Math.floor(Math.random() * 6) - 3);
                    }
                    optionsList.push(wrong);
                }
            }
            renderOptions();
        }

        // २. मराठी अक्षर ओळख गेम सुरू करणे
        function startMarathiABC() {
            currentMode = "marathiABC";
            showGameScreen();
            loadMarathiQuestion();
        }

        function loadMarathiQuestion() {
            document.getElementById("feedback").innerText = "";
            let index = Math.floor(Math.random() * marathiLetters.length);
            correctAnswer = marathiLetters[index];

            document.getElementById("question").innerText = `ओळखले का? हे अक्षर कोणते?`;
            // मोठे अक्षर दिसेल किंवा आवाजासारखे
            let displayChar = `<span style="color:#d63031; font-size:40px;">${correctAnswer}</span>`;
            document.getElementById("question").innerHTML = displayChar;

            let correctPos = Math.floor(Math.random() * 4);
            optionsList = [];
            let otherLetters = marathiLetters.filter(l => l !== correctAnswer);

            for (let i = 0; i < 4; i++) {
                if (i === correctPos) {
                    optionsList.push(correctAnswer);
                } else {
                    let randLet = otherLetters[Math.floor(Math.random() * otherLetters.length)];
                    while (optionsList.includes(randLet) || randLet === correctAnswer) {
                        randLet = otherLetters[Math.floor(Math.random() * otherLetters.length)];
                    }
                    optionsList.push(randLet);
                }
            }
            renderOptions();
        }

        // ३. गाळलेली एबीसीडी गेम सुरू करणे
        function startMissingABC() {
            currentMode = "missingABC";
            showGameScreen();
            loadMissingQuestion();
        }

        function loadMissingQuestion() {
            document.getElementById("feedback").innerText = "";
            let idx = Math.floor(Math.random() * 24);
            let c1 = alphabet[idx];
            let c2 = alphabet[idx + 1]; // गळलेले
            let c3 = alphabet[idx + 2];

            correctAnswer = c2;
            document.getElementById("question").innerText = `${c1}  _  ${c3}`;

            let correctPos = Math.floor(Math.random() * 4);
            optionsList = [];
            let otherChars = alphabet.filter(c => c !== correctAnswer);

            for (let i = 0; i < 4; i++) {
                if (i === correctPos) {
                    optionsList.push(correctAnswer);
                } else {
                    let randChar = otherChars[Math.floor(Math.random() * otherChars.length)];
                    while (optionsList.includes(randChar) || randChar === correctAnswer) {
                        randChar = otherChars[Math.floor(Math.random() * otherChars.length)];
                    }
                    optionsList.push(randChar);
                }
            }
            renderOptions();
        }

        function renderOptions() {
            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt${i}`);
                btn.innerText = optionsList[i];
                btn.disabled = false;
            }
        }

        function checkAnswer(selectedIndex) {
            let selectedVal = optionsList[selectedIndex];
            let feedback = document.getElementById("feedback");

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt${i}`).disabled = true;
            }

            if (selectedVal === correctAnswer) {
                score += 10;
                feedback.style.color = "#00b894";
                feedback.innerText = "🎉 अगदी बरोबर! शाब्बास!";
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
            } else {
                score = Math.max(0, score - 5);
                feedback.style.color = "#d63031";
                feedback.innerText = `❌ चूक! उत्तर होते: ${correctAnswer}`;
            }

            document.getElementById("score").innerText = score;

            // पुढील प्रश्नासाठी टाइमर
            setTimeout(() => {
                if (currentMode === "math") loadMathQuestion();
                else if (currentMode === "marathiABC") loadMarathiQuestion();
                else if (currentMode === "missingABC") loadMissingQuestion();
            }, 1800);
        }
    </script>

</body>
</html>
