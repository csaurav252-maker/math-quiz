<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लहान मुलांचा गणिताचा खेळ</title>
    <!-- Celebration/Confetti Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        h1 {
            color: #d63031;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 15px;
            background: #f1f2f6;
            padding: 8px 15px;
            border-radius: 10px;
        }
        .question-box {
            font-size: 32px;
            font-weight: bold;
            color: #0984e3;
            margin: 15px 0;
            background: #dfe6e9;
            padding: 15px;
            border-radius: 10px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #00cec9;
            transform: scale(1.05);
        }
        #feedback {
            font-size: 16px;
            font-weight: bold;
            height: 25px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>🧮 गणिताची जादू 🚀</h1>

        <div class="stats-bar">
            <div>🏆 गुण: <span id="score">0</span></div>
            <div>⏱️ वेळ: <span id="timer">10</span>s</div>
        </div>

        <div class="question-box" id="question">Loading...</div>

        <div class="options">
            <button class="btn" onclick="checkAnswer(0)" id="opt0">0</button>
            <button class="btn" onclick="checkAnswer(1)" id="opt1">0</button>
            <button class="btn" onclick="checkAnswer(2)" id="opt2">0</button>
            <button class="btn" onclick="checkAnswer(3)" id="opt3">0</button>
        </div>

        <div id="feedback"></div>
    </div>

    <script>
        let score = 0;
        let correctAnswer = 0;
        let timeLeft = 10;
        let timerInterval;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 10;
            document.getElementById("timer").innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    let feedback = document.getElementById("feedback");
                    feedback.style.color = "#e17055";
                    feedback.innerText = "⏰ वेळ संपली!";
                    setTimeout(generateQuestion, 1500);
                }
            }, 1000);
        }

        function generateQuestion() {
            document.getElementById("feedback").innerText = "";

            let num1 = Math.floor(Math.random() * 10) + 1;
            let num2 = Math.floor(Math.random() * 10) + 1;
            let operations = ['+', '-'];
            let op = operations[Math.floor(Math.random() * operations.length)];

            if (op === '-' && num1 < num2) {
                let temp = num1;
                num1 = num2;
                num2 = temp;
            }

            correctAnswer = (op === '+') ? (num1 + num2) : (num1 - num2);

            document.getElementById("question").innerText = `${num1} ${op} ${num2} = ?`;

            let correctPosition = Math.floor(Math.random() * 4);
            let options = [];

            for (let i = 0; i < 4; i++) {
                if (i === correctPosition) {
                    options.push(correctAnswer);
                } else {
                    let wrongAnswer;
                    do {
                        wrongAnswer = correctAnswer + (Math.floor(Math.random() * 6) - 3);
                    } while (wrongAnswer === correctAnswer || wrongAnswer < 0 || options.includes(wrongAnswer));
                    options.push(wrongAnswer);
                }
            }

            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`opt${i}`);
                btn.innerText = options[i];
                btn.dataset.value = options[i];
                btn.disabled = false;
            }

            startTimer();
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);

            let selectedBtn = document.getElementById(`opt${selectedIndex}`);
            let selectedVal = parseInt(selectedBtn.dataset.value);
            let feedback = document.getElementById("feedback");

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt${i}`).disabled = true;
            }

            if (selectedVal === correctAnswer) {
                score += 10;
                feedback.style.color = "#00b894";
                feedback.innerText = "🎉 अगदी बरोबर! शाब्बास!";

                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });

            } else {
                score = Math.max(0, score - 5);
                feedback.style.color = "#d63031";
                feedback.innerText = `❌ चूक! उत्तर होते: ${correctAnswer}`;
            }

            document.getElementById("score").innerText = score;
            setTimeout(generateQuestion, 1800);
        }

        generateQuestion();
    </script>

</body>
</html>
